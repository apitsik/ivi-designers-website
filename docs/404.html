    <title>Страница не найдена — команда дизайна иви</title>
    <!-- Страница открывается по любому несуществующему адресу (в том числе
         глубокому), поэтому относительные пути считаем от корня сайта:
         на github.io это папка проекта, на своём домене — корень. -->
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var base = /github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
        document.write('<base href="' + base + '">');
      })();
    </script>
