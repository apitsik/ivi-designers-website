# nginx-конфиг для сайта команды дизайна иви (статика из dist/).
#
# Как поставить:
#   1. Залить содержимое dist/ в /var/www/ivi-designers (или поменять root ниже)
#   2. Скопировать этот файл в /etc/nginx/sites-available/ivi-designers.conf
#      и заменить DOMAIN на свой домен (4 места)
#   3. ln -s /etc/nginx/sites-available/ivi-designers.conf /etc/nginx/sites-enabled/
#   4. Сертификат: certbot --nginx -d DOMAIN (сам впишет ssl_certificate*)
#   5. nginx -t && systemctl reload nginx
#
# Проверить, что nginx знает woff2: grep woff2 /etc/nginx/mime.types
# Если пусто — добавить в /etc/nginx/mime.types строку:  font/woff2  woff2;
#
# Brotli (жмёт на ~15–20 % лучше gzip) есть не во всех сборках nginx —
# блок закомментирован, раскомментировать, если `nginx -V` показывает ngx_brotli.

# Срок кэша по пути. Один add_header на уровне server, поэтому заголовки
# безопасности не теряются внутри location (add_header в location их бы затёр).
map $uri $cache_control {
    default                                  "public, max-age=86400";
    ~^/assets/                               "public, max-age=31536000, immutable";  # сборка Vite, имена с хэшем
    ~^/fonts/                                "public, max-age=31536000, immutable";
    ~^/(images|stickers|cursors|video)/      "public, max-age=2592000";              # месяц
    ~^/(favicon|apple-touch-icon)            "public, max-age=604800";               # неделя
    ~^/(index\.html)?$                       "no-cache";                             # всегда свежий, чтобы подхватывать новые хэши
}

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # certbot заполнит сам; если сертификат уже есть — вписать пути
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ivi-designers;
    index index.html;
    charset utf-8;

    # --- Сжатие текста (картинки и видео уже сжаты — их не трогаем) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml;

    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain text/css text/javascript application/javascript
    #     application/json image/svg+xml;

    # --- Заголовки: кэш по карте выше + безопасность ---
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Статика без логов (картинки, видео, шрифты, сборка). Range-запросы
    # для .mp4 (перемотка, догрузка) nginx отдаёт сам.
    location ~* ^/(assets|fonts|images|stickers|cursors|video)/ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Служебное не отдаём
    location ~ /\. {
        deny all;
    }
}
