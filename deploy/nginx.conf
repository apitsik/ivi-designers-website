# nginx для сайта команды дизайна иви — статичная сборка Vite (папка dist/).
#
# Как поставить:
#   1. Собрать на маке: npm run build  (шрифты в public/fonts/ должны быть на месте)
#   2. Залить СОДЕРЖИМОЕ dist/ на сервер в /var/www/ivi-designers  (путь ниже)
#   3. Положить этот файл в /etc/nginx/sites-available/ivi-designers.conf,
#      заменить example.com на свой домен (3 места), включить и перезагрузить:
#        ln -s /etc/nginx/sites-available/ivi-designers.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#   4. HTTPS: certbot --nginx -d example.com — сам подставит пути к сертификату.
#      Пока сертификата нет: закомментировать блок 443 и в блоке 80 заменить
#      return 301 на содержимое блока 443 начиная с root.
#
# Заметка про add_header: в nginx add_header внутри location ОТМЕНЯЕТ add_header
# уровня server, поэтому базовые заголовки повторены в каждом location.

# http → https
server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  root /var/www/ivi-designers;
  index index.html;
  charset utf-8;

  # ---- Сжатие текстовых ответов. Картинки, видео и woff2 уже сжаты — их не трогаем.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Если nginx собран с brotli (nginx-extras / модуль ngx_brotli) — лучше его:
  # brotli on;
  # brotli_types text/css application/javascript application/json image/svg+xml;

  # ---- index.html: не кэшируем, он ссылается на хэшированные ассеты и должен быть свежим
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # ---- Плейлист мини-плеера: меняется руками, кэшировать нельзя (точное совпадение
  #      побеждает регулярку /music/ ниже)
  location = /music/playlist.json {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---- /assets/: файлы с хэшем в имени (index-XXXX.js, logo-XXXX.png) — кэш навсегда
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---- Картинки, стикеры, курсоры, шрифты, видео: имена стабильные — кэш на месяц.
  # Range-запросы для mp4/mp3 (перемотка, canplaythrough) nginx отдаёт сам, модули не нужны.
  location ~* ^/(images|stickers|cursors|fonts|video|music)/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---- Фавиконы
  location ~* ^/(favicon.*|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  # ---- Скрытые файлы не отдаём
  location ~ /\. {
    deny all;
  }

  # ---- Всё остальное: файл, иначе index.html (одностраничник с якорями)
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # CSP намеренно не задаём: попапы тянут плеер и oEmbed с vimeo.com,
  # а на сайте нет форм и бэкенда — ограничивать нечего.

  access_log /var/log/nginx/ivi-designers.access.log;
  error_log  /var/log/nginx/ivi-designers.error.log;
}

# Проверить после запуска:
#   curl -I https://example.com/                       → 200, Cache-Control: no-cache
#   curl -I https://example.com/assets/<имя>.js        → Cache-Control: ... immutable, Content-Encoding: gzip
#   curl -I https://example.com/fonts/IVI_Sans_Base_Regular.woff2  → Content-Type: font/woff2
#   curl -I -H "Range: bytes=0-100" https://example.com/video/hero-ivi.mp4  → 206 Partial Content
