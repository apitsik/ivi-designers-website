<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Команда дизайна иви</title>
    <link rel="preload" href="/fonts/IVI_Sans_Base_Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IVI_Sans_Base_Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="nav">
      <nav class="nav__group nav__group--left" aria-label="Разделы">
        <a class="nav__item" href="#showreels"><span class="nav__label" data-text="Шоурилы">Шоурилы</span></a>
        <a class="nav__item" href="#teams"><span class="nav__label" data-text="Команды">Команды</span></a>
        <a class="nav__item" href="#cases"><span class="nav__label" data-text="Кейсы">Кейсы</span></a>
        <a class="nav__item" href="#awards"><span class="nav__label" data-text="Награды">Награды</span></a>
        <a class="nav__item" href="#articles"><span class="nav__label" data-text="Статьи">Статьи</span></a>
      </nav>

      <a class="nav__logo" href="#top" aria-label="Наверх страницы">
        <!-- Кадры логотипа подставляются из assets/logos/ в src/nav-logo.js -->
        <img class="nav__logo-img" width="64" height="64" alt="" />
      </a>

      <nav class="nav__group nav__group--right" aria-label="Внешние ссылки">
        <a class="nav__item" href="#lab"><span class="nav__label" data-text="ivi design lab">ivi design lab</span></a>
        <a class="nav__item" href="#brandbook"><span class="nav__label" data-text="Брендбук">Брендбук</span></a>
        <a class="nav__item" href="#behance"><span class="nav__label" data-text="Беханс">Беханс</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__background" aria-hidden="true"></div>

        <div class="hero__content">
          <video
            class="hero__video"
            src="/video/hero-ivi.mp4"
            muted
            playsinline
            preload="auto"
            disablepictureinpicture
            disableremoteplayback
            aria-hidden="true"
            tabindex="-1"
          ></video>

          <button class="hero__hint" type="button" aria-pressed="false">
            <span class="hero__hint-roll">
              <span>[ тапай, чтобы добавить вайб ]</span>
              <span>[ удалить вайб ]</span>
            </span>
          </button>

          <div class="hero__text">
            <h1 id="hero-title" class="hero__title">Команда дизайна</h1>
            <p class="hero__subtitle">
              Дизайн в Иви всегда про людей. И создаётся<br />
              такими же людьми
            </p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
